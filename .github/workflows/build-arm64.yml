- name: Vet and build linux/arm64 probe and service
  run: |
    go mod tidy
    go vet ./...
    CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o vohiver-probe ./cmd/pcsc-probe
    CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o vohiver-service ./cmd/vohiver-service
    ls -lh vohiver-probe vohiver-service
    file vohiver-probe vohiver-service || true
- name: Upload ARM64 probe artifact
  uses: actions/upload-artifact@v4
  with:
    name: vohiver-probe-linux-arm64
    path: vohiver-probe
    if-no-files-found: error
- name: Upload ARM64 service artifact
  uses: actions/upload-artifact@v4
  with:
    name: vohiver-service-linux-arm64
    path: vohiver-service
    if-no-files-found: error
